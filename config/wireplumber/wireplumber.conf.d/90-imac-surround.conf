# Keep software volume and upmix stereo streams to all four physical channels.
monitor.alsa.rules = [
  {
    matches = [ { device.name = "alsa_card.pci-0000_00_1b.0" } ]
    actions = {
      update-props = {
        api.alsa.soft-mixer = true
        api.alsa.ignore-dB = true
      }
    }
  }
  {
    matches = [
      { node.name = "alsa_output.pci-0000_00_1b.0.analog-surround-40" }
    ]
    actions = {
      update-props = {
        channelmix.upmix = true
        channelmix.upmix-method = "simple"
        channelmix.rear-delay = 0.0
        channelmix.stereo-widen = 0.0
      }
    }
  }
]
