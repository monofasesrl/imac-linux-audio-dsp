# iMac16,2: stereo input -> FL/FR tweeters + RL/RR woofers.
context.modules = [
  { name = libpipewire-module-filter-chain
    args = {
      node.description = "iMac DSP"
      media.name = "iMac DSP"
      filter.graph = {
        nodes = [
          { type = builtin name = copyL label = copy }
          { type = builtin name = copyR label = copy }
          { type = builtin name = crossover label = param_eq
            config = {
              filters1 = [
                { type = bq_highshelf freq = 0 gain = -1.0 }
                { type = bq_highpass freq = 350 q = 0.7071 }
                { type = bq_highpass freq = 350 q = 0.7071 }
                { type = bq_highshelf freq = 6500 gain = -1.0 q = 0.7071 }
              ]
              filters2 = [
                { type = bq_highshelf freq = 0 gain = -1.0 }
                { type = bq_highpass freq = 350 q = 0.7071 }
                { type = bq_highpass freq = 350 q = 0.7071 }
                { type = bq_highshelf freq = 6500 gain = -1.0 q = 0.7071 }
              ]
              filters3 = [
                { type = bq_highshelf freq = 0 gain = -1.0 }
                { type = bq_highpass freq = 45 q = 0.7071 }
                { type = bq_highpass freq = 45 q = 0.7071 }
                { type = bq_lowpass freq = 350 q = 0.7071 }
                { type = bq_lowpass freq = 350 q = 0.7071 }
              ]
              filters4 = [
                { type = bq_highshelf freq = 0 gain = -1.0 }
                { type = bq_highpass freq = 45 q = 0.7071 }
                { type = bq_highpass freq = 45 q = 0.7071 }
                { type = bq_lowpass freq = 350 q = 0.7071 }
                { type = bq_lowpass freq = 350 q = 0.7071 }
              ]
            }
          }
        ]
        links = [
          { output = "copyL:Out" input = "crossover:In 1" }
          { output = "copyR:Out" input = "crossover:In 2" }
          { output = "copyL:Out" input = "crossover:In 3" }
          { output = "copyR:Out" input = "crossover:In 4" }
        ]
        inputs = [ "copyL:In" "copyR:In" ]
        outputs = [
          "crossover:Out 1" "crossover:Out 2"
          "crossover:Out 3" "crossover:Out 4"
        ]
      }
      capture.props = {
        node.name = "imac_dsp"
        node.description = "iMac DSP"
        media.class = "Audio/Sink"
        audio.channels = 2
        audio.position = [ FL FR ]
      }
      playback.props = {
        node.name = "imac_dsp_output"
        node.description = "iMac DSP output"
        node.target = "alsa_output.pci-0000_00_1b.0.analog-surround-40"
        node.passive = true
        stream.dont-remix = true
        audio.channels = 4
        audio.position = [ FL FR RL RR ]
      }
    }
  }
]
